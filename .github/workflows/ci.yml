# =============================================================================
# GitHub Actions CI — mirrors .circleci/config.yml for platform comparison.
#
# Note what lives IN THIS FILE that CircleCI and Harness both push into
# project settings: the nightly schedule (on.schedule) and auto-cancel of
# superseded runs (concurrency). That asymmetry is a real comparison finding.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  # Nightly — in-file, no UI trigger needed
  schedule:
    - cron: '0 3 * * *'
  # Counterpart to CircleCI pipeline parameters
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: 'Run the Node 18/20/22 matrix'
        type: boolean
        default: false
      run_flaky:
        description: 'Run the flaky test suite'
        type: boolean
        default: false

# Auto-cancel superseded runs on the same ref — a project setting on CircleCI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # needed by dorny/test-reporter
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis — three parallel jobs, no shared "setup" job. setup-node's
  # cache: npm caches ~/.npm, which is the correct thing (the CircleCI config
  # caches node_modules, which npm ci deletes before installing).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p test-results
      - run: npx eslint . --format json --output-file test-results/eslint.json || true
      - name: ESLint (fail on error)
        run: npx eslint .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eslint-report
          path: test-results/eslint.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx tsc --version

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p test-results
      - run: npm audit --audit-level=critical --json > test-results/audit.json 2>&1 || true
      - run: npm audit --audit-level=critical || echo "vulnerabilities found (see artifact)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-report
          path: test-results/audit.json

  # ---------------------------------------------------------------------------
  # Sharded unit tests. GitHub Actions has no native test splitting, so the
  # matrix index does the work manually — the weakest of the three platforms
  # on this axis.
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Run unit tests (shard ${{ matrix.shard }} of 2)
        run: |
          mkdir -p test-results
          FILES=$(ls src/components/game/__tests__/GameLogic*.test.ts | awk "NR % 2 == ${{ matrix.shard }}")
          echo "Running: $FILES"
          npx vitest run $FILES \
            --reporter=junit --reporter=default \
            --outputFile.junit=test-results/junit-unit-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-unit-${{ matrix.shard }}
          path: test-results/junit-unit-${{ matrix.shard }}.xml

  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: |
          mkdir -p test-results
          npx vitest run src/components/game/__tests__/GuessInput*.test.tsx \
            --reporter=junit --reporter=default \
            --outputFile.junit=test-results/junit-component.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-component
          path: test-results/junit-component.xml

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: |
          mkdir -p test-results
          npx vitest run src/components/game/__tests__/GameSimulation.integration.test.ts \
            --reporter=junit --reporter=default \
            --outputFile.junit=test-results/junit-integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-integration
          path: test-results/junit-integration.xml

  # ---------------------------------------------------------------------------
  # Coverage gate. Uses node for the comparison, not bc — bc is absent from
  # cimg/node, which silently neutralises the same check on CircleCI.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, integration-tests]
    env:
      MIN_LINES: '5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Run stable suite with coverage
        run: |
          mkdir -p test-results
          npx vitest run --exclude '**/*.flaky.test.*' --coverage \
            --coverage.reporter=json-summary --coverage.reporter=html --coverage.reporter=text \
            --reporter=junit --reporter=default \
            --outputFile.junit=test-results/junit-coverage.xml
      - name: Enforce coverage threshold
        run: |
          node -e "
            const p = require('./coverage/coverage-summary.json').total.lines.pct;
            console.log('Line coverage: ' + p + '%');
            const min = Number(process.env.MIN_LINES);
            if (p < min) { console.error('FAIL: below ' + min + '%'); process.exit(1); }
          "
      - name: Write coverage to job summary
        if: always()
        run: |
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            console.log('| metric | % |');
            console.log('|---|---|');
            for (const k of ['lines','statements','branches','functions'])
              console.log('| ' + k + ' | ' + t[k].pct + ' |');
          " >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage

  # ---------------------------------------------------------------------------
  # Test reporting. GitHub Actions has NO native JUnit ingestion — this needs a
  # third-party action. CircleCI and Buildkite both do it first-party.
  # ---------------------------------------------------------------------------
  test-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all-results
      - uses: dorny/test-reporter@v3
        with:
          name: Vitest results
          path: 'all-results/**/junit-*.xml'
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # Build + the same assertions build-verification/bundle-analysis make.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, coverage]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify build output
        run: |
          test -d dist || { echo "FAIL: dist/ missing"; exit 1; }
          test -f dist/index.html || { echo "FAIL: no index.html"; exit 1; }
          JS_COUNT=$(find dist/assets -name '*.js' | wc -l)
          CSS_COUNT=$(find dist/assets -name '*.css' | wc -l)
          echo "JS: $JS_COUNT  CSS: $CSS_COUNT"
          [ "$JS_COUNT" -gt 0 ] || { echo "FAIL: no JS"; exit 1; }
          [ "$CSS_COUNT" -gt 0 ] || { echo "FAIL: no CSS"; exit 1; }
          echo "source maps: $(find dist -name '*.map' | wc -l)"
      - name: Bundle size guard
        run: |
          js_total=0
          for f in dist/assets/*.js; do js_total=$((js_total + $(wc -c < "$f"))); done
          echo "Total JS: $((js_total / 1024)) KB" | tee -a $GITHUB_STEP_SUMMARY
          if [ "$js_total" -gt 2097152 ]; then echo "FAIL: JS over 2MB"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist

  # ---------------------------------------------------------------------------
  # Node version matrix — gated, like CircleCI's run_full_matrix parameter.
  # Also runs on the nightly schedule.
  # ---------------------------------------------------------------------------
  node-matrix:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_full_matrix
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: |
          mkdir -p test-results
          npx vitest run --exclude '**/*.flaky.test.*' \
            --reporter=junit --reporter=default \
            --outputFile.junit=test-results/junit-node${{ matrix.node }}.xml
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Flaky suite — gated, mirrors the CircleCI flaky_investigation workflow.
  # ---------------------------------------------------------------------------
  flaky-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Flaky attempts 1-3
        run: |
          mkdir -p test-results
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            RUN_FLAKY=true npx vitest run src/components/game/__tests__/*.flaky.test.* \
              --reporter=junit --reporter=default \
              --outputFile.junit=test-results/junit-flaky-$i.xml || echo "attempt $i had failures"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-flaky
          path: test-results/junit-flaky-*.xml

  # ---------------------------------------------------------------------------
  # Deploy — the `environment:` key is the approval gate. Configure required
  # reviewers under Settings > Environments > staging. Free on public repos.
  # ---------------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist
      - name: Secret masking probe
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN not set"
          else
            echo "DEPLOY_TOKEN length: ${#DEPLOY_TOKEN}"
            echo "Printing the token to check log masking: $DEPLOY_TOKEN"
          fi
      - run: |
          ls dist | head -20
          echo "Deployed to staging"
