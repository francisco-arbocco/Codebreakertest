<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atari Asteroid Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 3px solid #0f0;
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 16px;
            text-shadow: 0 0 10px #0f0;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 32px;
            text-align: center;
            display: none;
            text-shadow: 0 0 20px #0f0;
        }
        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #gameOver button:hover {
            background: #0f0;
            color: #000;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>LEVEL: <span id="level">1</span></div>
        </div>
        <div id="gameOver">
            <div>GAME OVER</div>
            <div style="font-size: 18px; margin-top: 10px;">Final Score: <span id="finalScore">0</span></div>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
        <div id="instructions">AIM WITH MOUSE | CLICK TO SHOOT | DESTROY ALL ASTEROIDS</div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = true;
        let mouseX = canvas.width / 2;
        let mouseY = 0;

        // Ship (fixed in center)
        const ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            angle: 0,
            size: 20,
            invincible: false,
            invincibleTimer: 0
        };

        // Bullets
        let bullets = [];
        const BULLET_SPEED = 8;
        const BULLET_LIFE = 60;
        const FIRE_RATE = 10;
        let fireTimer = 0;
        let mouseDown = false;

        // Asteroids
        let asteroids = [];
        const ASTEROID_SPEED = 2;

        // Particles for explosions
        let particles = [];

        // Initialize asteroids
        function spawnAsteroids(count) {
            for (let i = 0; i < count; i++) {
                spawnAsteroid(3); // Size 3 = large
            }
        }

        function spawnAsteroid(size, x, y) {
            // Spawn from edges if no position given
            if (x === undefined || y === undefined) {
                const edge = Math.floor(Math.random() * 4);
                switch (edge) {
                    case 0: x = 0; y = Math.random() * canvas.height; break;
                    case 1: x = canvas.width; y = Math.random() * canvas.height; break;
                    case 2: x = Math.random() * canvas.width; y = 0; break;
                    case 3: x = Math.random() * canvas.width; y = canvas.height; break;
                }
            }

            const angle = Math.random() * Math.PI * 2;
            const speed = ASTEROID_SPEED + Math.random() * level * 0.5;

            // Generate jagged asteroid shape
            const vertices = [];
            const numVertices = 8 + Math.floor(Math.random() * 5);
            const baseRadius = size * 15;

            for (let i = 0; i < numVertices; i++) {
                const a = (i / numVertices) * Math.PI * 2;
                const r = baseRadius * (0.7 + Math.random() * 0.5);
                vertices.push({ angle: a, radius: r });
            }

            asteroids.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: size,
                radius: baseRadius,
                vertices: vertices,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.05
            });
        }

        // Create explosion particles
        function createExplosion(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 30 + Math.random() * 20,
                    color: color || '#0f0'
                });
            }
        }

        // Mouse events
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mouseleave', () => mouseDown = false);

        // Fire bullet
        function fireBullet() {
            const angle = ship.angle;
            bullets.push({
                x: ship.x + Math.cos(angle) * ship.size,
                y: ship.y + Math.sin(angle) * ship.size,
                vx: Math.cos(angle) * BULLET_SPEED,
                vy: Math.sin(angle) * BULLET_SPEED,
                life: BULLET_LIFE
            });
        }

        // Update game state
        function update() {
            if (!gameRunning) return;

            // Update ship angle to face mouse
            ship.angle = Math.atan2(mouseY - ship.y, mouseX - ship.x);

            // Handle invincibility
            if (ship.invincible) {
                ship.invincibleTimer--;
                if (ship.invincibleTimer <= 0) {
                    ship.invincible = false;
                }
            }

            // Fire bullets
            if (mouseDown && fireTimer <= 0) {
                fireBullet();
                fireTimer = FIRE_RATE;
            }
            if (fireTimer > 0) fireTimer--;

            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.life--;
                return bullet.life > 0 &&
                       bullet.x > 0 && bullet.x < canvas.width &&
                       bullet.y > 0 && bullet.y < canvas.height;
            });

            // Update asteroids
            asteroids.forEach(asteroid => {
                asteroid.x += asteroid.vx;
                asteroid.y += asteroid.vy;
                asteroid.rotation += asteroid.rotationSpeed;

                // Bounce off walls
                if (asteroid.x < 0 || asteroid.x > canvas.width) {
                    asteroid.vx *= -1;
                    asteroid.x = Math.max(0, Math.min(canvas.width, asteroid.x));
                }
                if (asteroid.y < 0 || asteroid.y > canvas.height) {
                    asteroid.vy *= -1;
                    asteroid.y = Math.max(0, Math.min(canvas.height, asteroid.y));
                }
            });

            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                return p.life > 0;
            });

            // Collision detection: bullets vs asteroids
            bullets.forEach((bullet, bi) => {
                asteroids.forEach((asteroid, ai) => {
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < asteroid.radius) {
                        // Hit!
                        bullet.life = 0;
                        createExplosion(asteroid.x, asteroid.y, 10, '#0f0');

                        // Score based on size
                        score += (4 - asteroid.size) * 20;
                        document.getElementById('score').textContent = score;

                        // Split asteroid
                        if (asteroid.size > 1) {
                            spawnAsteroid(asteroid.size - 1, asteroid.x, asteroid.y);
                            spawnAsteroid(asteroid.size - 1, asteroid.x, asteroid.y);
                        }

                        asteroids.splice(ai, 1);
                    }
                });
            });

            // Collision detection: ship vs asteroids
            if (!ship.invincible) {
                asteroids.forEach((asteroid, ai) => {
                    const dx = ship.x - asteroid.x;
                    const dy = ship.y - asteroid.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < asteroid.radius + ship.size * 0.7) {
                        // Ship hit!
                        lives--;
                        document.getElementById('lives').textContent = lives;
                        createExplosion(ship.x, ship.y, 20, '#f00');

                        if (lives <= 0) {
                            gameOver();
                        } else {
                            ship.invincible = true;
                            ship.invincibleTimer = 120;
                        }
                    }
                });
            }

            // Level complete
            if (asteroids.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                spawnAsteroids(3 + level);
            }
        }

        // Draw game
        function draw() {
            // Clear canvas with slight trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars (background)
            ctx.fillStyle = '#333';
            for (let i = 0; i < 50; i++) {
                const x = (i * 73) % canvas.width;
                const y = (i * 91) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }

            // Draw ship
            if (!ship.invincible || Math.floor(Date.now() / 100) % 2) {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.angle);

                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                // Classic Atari ship shape
                ctx.moveTo(ship.size, 0);
                ctx.lineTo(-ship.size * 0.7, -ship.size * 0.6);
                ctx.lineTo(-ship.size * 0.4, 0);
                ctx.lineTo(-ship.size * 0.7, ship.size * 0.6);
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }

            // Draw bullets
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 5;
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw asteroids
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 5;

            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.rotation);

                ctx.beginPath();
                const first = asteroid.vertices[0];
                ctx.moveTo(
                    Math.cos(first.angle) * first.radius,
                    Math.sin(first.angle) * first.radius
                );

                for (let i = 1; i < asteroid.vertices.length; i++) {
                    const v = asteroid.vertices[i];
                    ctx.lineTo(
                        Math.cos(v.angle) * v.radius,
                        Math.sin(v.angle) * v.radius
                    );
                }
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            });

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 50;
                ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
            });
            ctx.globalAlpha = 1;

            // Draw crosshair at mouse position
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(mouseX - 10, mouseY);
            ctx.lineTo(mouseX + 10, mouseY);
            ctx.moveTo(mouseX, mouseY - 10);
            ctx.lineTo(mouseX, mouseY + 10);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart game
        function restartGame() {
            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            asteroids = [];
            particles = [];
            ship.invincible = false;
            gameRunning = true;

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            document.getElementById('gameOver').style.display = 'none';

            spawnAsteroids(4);
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        spawnAsteroids(4);
        gameLoop();
    </script>
</body>
</html>
